services:
  postgres:
    image: postgres:17-alpine
    container_name: nova_rio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_rio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nova_rio_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build: .
    container_name: nova_rio_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nova_rio}?schema=public
      REDIS_HOST: redis
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@novario.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Admin Master}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:

