name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nova_rio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_rio_test?schema=public

      - name: Rodar migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_rio_test?schema=public

      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_rio_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-ci
          JWT_EXPIRES_IN: 1h
          PORT: 8080

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'upsitesdigital/backend-nova-rio'

    steps:
      - name: Preparar chave SSH
        run: |
          mkdir -p /tmp
          if echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /tmp/deploy_key; then
            echo "Chave da VPS tratada como base64."
          else
            cat <<'EOF_KEY' > /tmp/deploy_key
            ${{ secrets.VPS_SSH_KEY }}
            EOF_KEY
            echo "Chave da VPS usada no formato raw."
          fi
          chmod 600 /tmp/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          script: |
            set -e
            cd /root/backend-nova-rio

            echo "📥 Atualizando código..."
            git fetch origin develop
            git reset --hard origin/develop

            echo "🐳 Subindo containers..."
            docker compose -p nova-rio-prod --env-file .env.production -f docker-compose.production.yml up --build -d

            echo "✅ Deploy concluído!"
