name: Deploy VPS

# Runs only after the CI workflow completes successfully on develop.
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'upsitesdigital/backend-nova-rio'

    steps:
      - name: Preparar chave SSH
        run: |
          mkdir -p /tmp
          if echo "$VPS_SSH_KEY" | base64 -d > /tmp/deploy_key; then
            echo "Chave da VPS tratada como base64."
          else
            printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
            echo "Chave da VPS usada no formato raw."
          fi
          chmod 600 /tmp/deploy_key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          script: |
            set -e
            cd /root/backend-nova-rio

            echo "📥 Atualizando código..."
            git fetch origin develop
            git reset --hard origin/develop

            echo "🐳 Subindo containers..."
            docker compose -p nova-rio-prod --env-file .env.production -f docker-compose.production.yml up --build -d

            echo "✅ Deploy concluído!"
