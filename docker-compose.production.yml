services:
  postgres:
    image: postgres:latest
    container_name: nova_rio_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_rio_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: nova_rio_redis_prod
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build: .
    container_name: nova_rio_backend_prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '3000:3000'

volumes:
  postgres_data_prod:

