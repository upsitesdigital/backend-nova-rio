services:
  postgres:
    image: postgres:latest
    container_name: nova_rio_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_rio_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: nova_rio_redis_staging
    restart: unless-stopped
    ports:
      - '6380:6379'

  backend:
    build: .
    container_name: nova_rio_backend_staging
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.staging
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '4000:3000'

volumes:
  postgres_data_staging:

