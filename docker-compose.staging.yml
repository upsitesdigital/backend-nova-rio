services:
  postgres:
    image: postgres:17-alpine
    container_name: nova_rio_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_rio_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: nova_rio_redis_staging
    restart: unless-stopped
    ports:
      - '6380:6379'

  backend:
    build: .
    container_name: nova_rio_backend_staging
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nova_rio_staging}?schema=public
      REDIS_HOST: redis
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@novario.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Admin Master}
    ports:
      - '4000:3000'

volumes:
  postgres_data_staging:

